<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F1" />
    <script>
      try {
        const theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add('ion-palette-high-contrast');
        if (theme === 'dark') document.documentElement.classList.add('ion-palette-dark');
        document.documentElement.lang = localStorage.getItem('compasser_lang') || 'ko';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121211' : '#F4F4F1';
      } catch {
        document.documentElement.classList.add('ion-palette-high-contrast');
      }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>ComPasser</title>
  </head>
  <body>
    <div id="ionic-shell"></div>
    <script type="module" src="/src/prototype/ionic-shell.jsx"></script>
  </body>
</html>
