<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      try {
        const theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add('ion-palette-high-contrast');
        if (theme === 'dark') document.documentElement.classList.add('ion-palette-dark');
        document.documentElement.lang = localStorage.getItem('compasser_lang') || 'ko';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121211' : '#FFFFFF';
      } catch {
        document.documentElement.classList.add('ion-palette-high-contrast');
      }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>ComPasser</title>
    <meta name="description" content="반드시 도착해야 하는 일정을 먼저 못박고, 나머지 동선을 그 주위로 다시 짜 주는 여행 플래너입니다." />
    <!-- No og:url or canonical: Pages serves this file for every SPA route, including /share/<id>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ComPasser" />
    <meta property="og:title" content="ComPasser" />
    <meta property="og:description" content="반드시 도착해야 하는 일정을 먼저 못박고, 나머지 동선을 그 주위로 다시 짜 주는 여행 플래너입니다." />
    <meta property="og:image" content="https://hackerton-48w.pages.dev/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- The boot screen paints before about 0.5 MB of app JS arrives (15 s on Slow 3G); React replaces it. -->
    <style>
      body { margin: 0; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 0; background: #FFFFFF; color: #101010; font-family: system-ui, -apple-system, sans-serif; }
      .boot strong { font-size: 1.5rem; letter-spacing: 0.02em; }
      .boot p { margin: 0; color: #45454b; }
      html[data-theme="dark"] .boot { background: #121211; color: #EDEDE9; }
      html[data-theme="dark"] .boot p { color: #C2C2BD; }
      html[lang="en"] .boot [lang="ko"], html:not([lang="en"]) .boot [lang="en"] { display: none; }
    </style>
  </head>
  <body>
    <div id="ionic-shell"><div class="boot" role="status"><strong>ComPasser</strong><p lang="ko">불러오는 중…</p><p lang="en">Loading…</p></div></div>
    <script type="module" src="/src/prototype/ionic-shell.jsx"></script>
  </body>
</html>
