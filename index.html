<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compasser</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Modern Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- App Container -->
  <main class="app-container">
    <header class="hero">
      <h1>Smart Travel AI</h1>
      <p>Optimize your itinerary around your must-attend events.</p>

      <!-- Theme Toggle & Logout -->
      <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;">
        <button id="theme-toggle" aria-label="Toggle Dark Mode" style="
          background: var(--bg-primary);
          color: var(--text-primary);
          border: 1px solid oklch(80% 0.02 260);
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: background 0.2s, color 0.2s;
        ">
          🌙 Dark Mode
        </button>
        <button id="my-itineraries-btn" aria-label="My Itineraries" style="
          background: var(--accent-primary, #7c3aed);
          color: white;
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: transform 0.2s, box-shadow 0.2s;
          display: none;
        ">
          📂 내 여행 일정 보기
        </button>
        <button id="logout-btn" aria-label="Logout" style="
          background: oklch(95% 0.02 260);
          color: var(--text-primary);
          border: 1px solid oklch(80% 0.02 260);
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: background 0.2s, color 0.2s;
          display: none;
        ">
          🚪 Logout
        </button>
      </div>
    </header>

    <!-- Login Landing Page -->
    <login-view id="login-view" style="display: none;"></login-view>

    <!-- My Itineraries Modal -->
    <div id="itineraries-modal" style="
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    ">
      <div style="
        background: var(--bg-primary);
        color: var(--text-primary);
        padding: 2rem;
        border-radius: 16px;
        width: 100%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow-xl);
      ">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">📂 내 여행 일정</h2>
          <button id="close-modal-btn"
            style="background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
        </div>
        <div id="itineraries-list" style="display: flex; flex-direction: column; gap: 1rem;">
          <!-- List items will be injected here -->
        </div>
      </div>
    </div>

    <!-- Web Components will be injected here -->
    <section class="content" id="app-content" style="display: none;">
      <!-- The custom travel form -->
      <travel-form></travel-form>

      <!-- Results Section Container -->
      <div class="results-layout" style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
        <map-view></map-view>
        <itinerary-view></itinerary-view>
      </div>
    </section>
  </main>

  <!-- Entry point for JS -->
  <script type="module" src="/src/app/main.js"></script>
</body>

</html>
