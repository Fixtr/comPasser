<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compasser</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Modern Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- App Container -->
  <main class="app-container">
    <header class="hero">
      <h1>Smart Travel AI</h1>
      <p>Optimize your itinerary around your must-attend events.</p>

      <!-- Theme Toggle -->
      <button id="theme-toggle" aria-label="Toggle Dark Mode" style="
        margin-top: 1rem;
        background: var(--bg-primary);
        color: var(--text-primary);
        border: 1px solid oklch(80% 0.02 260);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, color 0.2s;
      ">
        🌙 Dark Mode
      </button>
    </header>

    <!-- Web Components will be injected here -->
    <section class="content" id="app-content">
      <!-- The custom travel form -->
      <travel-form></travel-form>

      <!-- Results Section Container -->
      <div class="results-layout" style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
        <map-view></map-view>
        <itinerary-view></itinerary-view>
      </div>
    </section>
  </main>

  <!-- Entry point for JS -->
  <script type="module" src="/main.js"></script>
</body>

</html>
