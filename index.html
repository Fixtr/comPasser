<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor-Based AI Travel Planner</title>
  <!-- Modern Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- App Container -->
  <main class="app-container">
    <header class="hero">
      <h1>Smart Travel AI</h1>
      <p>Optimize your itinerary around your must-attend events.</p>
    </header>

    <!-- Web Components will be injected here -->
    <section class="content" id="app-content">
      <!-- The custom travel form -->
      <travel-form></travel-form>

      <!-- Results Section Container -->
      <div class="results-layout" style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
        <map-view></map-view>
        <itinerary-view></itinerary-view>
      </div>
    </section>
  </main>

  <!-- Entry point for JS -->
  <script type="module" src="/main.js"></script>
</body>

</html>
