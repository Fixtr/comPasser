<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compasser</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Modern Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <!-- Screenshot capture -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js"></script>
</head>

<body>
  <!-- App Container -->
  <main class="app-container">
    <header class="hero">
      <h1 data-i18n="heroTitle">Smart Travel AI</h1>
      <p data-i18n="heroSubtitle">Optimize your itinerary around your must-attend events.</p>

      <!-- Theme Toggle & Logout -->
      <button id="lang-toggle" aria-label="Toggle Language" style="
          background: var(--bg-primary);
          color: var(--text-primary);
          border: 1px solid oklch(80% 0.02 260);
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: background 0.2s, color 0.2s;
        ">
        🌐 한국어
      </button>
      <button id="theme-toggle" aria-label="Toggle Dark Mode" style="
          background: var(--bg-primary);
          color: var(--text-primary);
          border: 1px solid oklch(80% 0.02 260);
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: background 0.2s, color 0.2s;
        " data-i18n="darkMode">
        🌙 Dark Mode
      </button>
      <button id="my-itineraries-btn" aria-label="My Itineraries" style="
          background: var(--accent-primary, #7c3aed);
          color: white;
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: transform 0.2s, box-shadow 0.2s;
          display: none;
        " data-i18n="myItineraries">
        📂 내 여행 일정 보기
      </button>
      <button id="logout-btn" aria-label="Logout" style="
          background: oklch(95% 0.02 260);
          color: var(--text-primary);
          border: 1px solid oklch(80% 0.02 260);
          padding: 0.5rem 1rem;
          border-radius: 20px;
          cursor: pointer;
          font-weight: 600;
          transition: background 0.2s, color 0.2s;
          display: none;
        " data-i18n="logout">
        🚪 Logout
      </button>
      </div>
    </header>

    <!-- Login Landing Page -->
    <div id="page-home" class="page-container" style="display: none;">
      <login-view id="login-view"></login-view>
    </div>

    <!-- My Itineraries Modal -->
    <div id="itineraries-modal" style="
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    ">
      <div style="
        background: var(--bg-primary);
        color: var(--text-primary);
        padding: 2rem;
        border-radius: 16px;
        width: 100%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow-xl);
      ">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="margin: 0; display: flex; align-items: center; gap: 0.5rem;" data-i18n="myItinerariesTitle">📂 내 여행
            일정</h2>
          <button id="close-modal-btn"
            style="background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
        </div>
        <div id="itineraries-list" style="display: flex; flex-direction: column; gap: 1rem;">
          <!-- List items will be injected here -->
        </div>
      </div>
    </div>

    <!-- Web Components will be injected here -->
    <section class="content" id="app-content" style="display: none;">
      <!-- PAGE 2: PLAN (Travel Form & Loading) -->
      <div id="page-plan" class="page-container" style="display: none; flex-direction: column; width: 100%;">
        <!-- The custom travel form -->
        <travel-form id="travel-form-view" class="fade-transition"></travel-form>

        <!-- Phase 2: Full Screen Loading / Waiting View -->
        <div id="loading-transition-view" class="fade-transition hidden-view"
          style="display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center;">
          <div id="loading-spinner" class="large-spinner"></div>
          <h2 id="loading-text" style="margin-top: 1.5rem; color: var(--accent-primary);" data-i18n="loadingText">AI가 최적의
            경로를 분석하고 있습니다...</h2>
          <p id="loading-subtext" style="color: var(--text-secondary); margin-top: 0.5rem;" data-i18n="loadingSubtext">잠시만
            기다려주세요.</p>

          <button id="show-results-btn" class="primary-btn"
            style="display: none; margin-top: 2rem; max-width: 300px; padding: 1rem 2rem; background: linear-gradient(135deg, var(--accent-primary), oklch(55% 0.3 280)); color: white; border: none; font-size: 1.1rem; font-weight: 700; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
            data-i18n="showResultsBtn">
            ✨ 경로 확인하기
          </button>
        </div>
      </div>

      <!-- PAGE 3: VIEW (Results Section Container) -->
      <div id="page-view" class="page-container fade-transition hidden-view"
        style="display: none; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem; position: relative;">
        <!-- Back Navigation Actions -->
        <div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-bottom: -1rem; flex-wrap: wrap;">
          <button id="go-back-btn" style="
              width: fit-content;
              background: transparent;
              color: var(--text-secondary);
              border: 1px solid var(--text-secondary);
              padding: 0.6rem 1.2rem;
              font-size: 0.95rem;
              font-weight: 600;
              border-radius: 8px;
              cursor: pointer;
              transition: all 0.2s;
            " data-i18n="goBackBtn"
            onmouseover="this.style.background='var(--text-secondary)'; this.style.color='white';"
            onmouseout="this.style.background='transparent'; this.style.color='var(--text-secondary)';">
            ← 이전 화면으로
          </button>

          <button id="edit-itinerary-btn" style="
              width: fit-content;
              background: transparent;
              color: var(--accent-primary);
              border: 2px solid var(--accent-primary);
              padding: 0.6rem 1.2rem;
              font-size: 0.95rem;
              font-weight: 600;
              border-radius: 8px;
              cursor: pointer;
              transition: all 0.2s;
            " data-i18n="editItineraryBtn"
            onmouseover="this.style.background='var(--accent-primary)'; this.style.color='white';"
            onmouseout="this.style.background='transparent'; this.style.color='var(--accent-primary)';">
            일정 수정하기 ✏️
          </button>
        </div>

        <map-view></map-view>
        <itinerary-view></itinerary-view>
      </div>
    </section>
  </main>

  <!-- Entry point for JS -->
  <script type="module" src="/src/app/main.js"></script>
</body>

</html>
